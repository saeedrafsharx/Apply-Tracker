{% extends "base.html" %}
{% block content %}
<section class="max-w-md mx-auto gradient-card rounded-2xl bg-white dark:bg-slate-900 shadow p-6 border border-slate-200 dark:border-slate-800">
  <h2 class="text-xl font-semibold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 via-fuchsia-600 to-emerald-600">Create account</h2>
  {% if error %}
    <div class="mb-3 text-sm text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-900/40 border border-rose-200 dark:border-rose-800 rounded-lg p-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/register" class="grid gap-3">
    <input name="username" required placeholder="Username" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400" />
    <input name="email" type="email" placeholder="Email (optional)" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
    <input name="password" type="password" required placeholder="Password" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-400" />
    <button type="submit" class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-600 via-fuchsia-600 to-emerald-600 text-white shadow">Register</button>
  </form>
  <p class="mt-3 text-sm text-slate-600 dark:text-slate-300">Already have an account? <a class="text-sky-600 dark:text-sky-400 hover:underline" href="/login">Login</a></p>
</section>
{% endblock %}
