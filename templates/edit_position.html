{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto gradient-card rounded-2xl bg-white dark:bg-slate-900 shadow p-6 border border-slate-200 dark:border-slate-800">
  <h2 class="text-xl font-semibold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-600 via-sky-600 to-emerald-600">
    Edit position
  </h2>

  <form method="post" action="/positions/edit/{{ p.id }}" class="grid gap-3">
    <input name="field" value="{{ p.field }}" required placeholder="Field / Position title"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="link" value="{{ p.link }}" required placeholder="Link"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="category" value="{{ p.category or '' }}" placeholder="Category (optional)"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />

    <div class="flex items-center gap-2 mt-2">
      <button type="submit"
              class="px-4 py-2 rounded-xl bg-gradient-to-r from-fuchsia-600 via-sky-600 to-emerald-600 text-white shadow">
        Save changes
      </button>
      <a href="/positions" class="text-sm text-slate-600 dark:text-slate-300 hover:underline">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
