<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyList</title>

    <!-- Tailwind config BEFORE loading -->
    <script>
      tailwind = {
        config: {
          darkMode: 'class',
        }
      };
    </script>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Apply saved theme BEFORE page renders -->
    <script>
      (() => {
        const ls = localStorage.getItem('theme');
        const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (ls === 'dark' || (!ls && prefers)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <style>
      .gradient-card { position: relative; }
      .gradient-card::before {
        content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 1rem;
        background: linear-gradient(135deg, #06b6d4, #8b5cf6, #10b981);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        pointer-events: none;
      }
      .gradient-card > * { position: relative; z-index: 1; }
    </style>
  </head>

  <body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100
               dark:from-slate-950 dark:via-slate-950 dark:to-black dark:text-slate-100">

    <!-- HEADER -->
    <header class="sticky top-0 z-10 bg-white/70 dark:bg-slate-900/70 backdrop-blur border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

        <a href="/" class="text-xl font-semibold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-fuchsia-600 via-sky-600 to-emerald-600">
          ApplyList
        </a>

        {% set u = user if user is defined else request.state.user %}
        <nav class="flex items-center gap-4 text-sm">

          <a href="/professors" class="text-slate-700 dark:text-slate-200 hover:underline">Professors</a>
          <a href="/positions" class="text-slate-700 dark:text-slate-200 hover:underline">Positions</a>

          <!-- Theme toggle -->
          <button id="themeToggle" title="Toggle theme"
                  class="px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700
                         hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            <span id="iconSun" class="hidden dark:inline">Day</span>
            <span id="iconMoon" class="inline dark:hidden">Night</span>
          </button>

          {% if u %}
            <span class="text-slate-600 dark:text-slate-300">Hi, {{ u.username }}</span>
            <form action="/logout" method="post">
              <button class="px-3 py-1 rounded-lg bg-gradient-to-r from-rose-500 to-orange-500 text-white">Logout</button>
            </form>
          {% else %}
            <a class="px-3 py-1 rounded-lg bg-gradient-to-r from-sky-600 to-indigo-600 text-white" href="/login">Login</a>
            <a class="px-3 py-1 rounded-lg border border-slate-200 dark:border-slate-700" href="/register">Register</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-4">
      {% block content %}{% endblock %}
    </main>

    <footer class="max-w-7xl mx-auto px-4 py-10 text-xs text-slate-500 dark:text-slate-400">
      Built by Saeid, Enjoy.
    </nav>
  </div>
</header>


  </body>
</html>
