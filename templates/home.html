  <div class="grid gap-6">
    <a href="/professors"
       class="p-8 text-center rounded-2xl bg-gradient-to-r from-sky-600 to-indigo-600 text-white text-2xl font-semibold shadow hover:opacity-90">

    <a href="/positions"
       class="p-8 text-center rounded-2xl bg-gradient-to-r from-fuchsia-600 to-rose-600 text-white text-2xl font-semibold shadow hover:opacity-90">

    </a>

    <a href="#"
       class="p-8 text-center rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-2xl font-semibold shadow opacity-70 cursor-not-allowed">
