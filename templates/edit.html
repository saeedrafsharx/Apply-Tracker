{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto gradient-card rounded-2xl bg-white dark:bg-slate-900 shadow p-6 border border-slate-200 dark:border-slate-800">
  <h2 class="text-xl font-semibold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-sky-600 via-fuchsia-600 to-emerald-600">
    Edit professor
  </h2>

  <form method="post" action="/edit/{{ c.id }}" class="grid gap-3">
    <input name="name" value="{{ c.name }}" required placeholder="Name"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="university" value="{{ c.university }}" required placeholder="University"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="research_focus" value="{{ c.research_focus }}" required placeholder="Research focus"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="contact_email" type="email" value="{{ c.contact_email }}" required placeholder="Contact email"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="source_url" value="{{ c.source_url }}" placeholder="Source URL"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
    <input name="category" value="{{ c.category or '' }}" placeholder="Category (optional)"
           class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />

    <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
      <input type="checkbox" name="email_sent" {% if c.email_sent %}checked{% endif %} />
      Email sent
    </label>

    <label class="inline-flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
      <input type="checkbox" name="reminder_sent" {% if c.reminder_sent %}checked{% endif %} />
      Reminder sent
    </label>

    <div class="flex items-center gap-2 mt-2">
      <button type="submit"
              class="px-4 py-2 rounded-xl bg-gradient-to-r from-sky-600 via-fuchsia-600 to-emerald-600 text-white shadow">
        Save changes
      </button>
      <a href="/professors" class="text-sm text-slate-600 dark:text-slate-300 hover:underline">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
